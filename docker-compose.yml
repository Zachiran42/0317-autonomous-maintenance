services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: local
      AGENT_RUNTIME: local
      PERSISTENCE_BACKEND: memory
      EVENT_BACKEND: local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

