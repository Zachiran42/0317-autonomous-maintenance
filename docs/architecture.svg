<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">03:17 autonomous maintenance architecture</title>
  <desc id="desc">Event-driven Google Cloud architecture separating Gemini planning, semantic plan validation, dependency scheduling, and deterministic evidence-gated execution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071014"/><stop offset="1" stop-color="#0d1918"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5f7a80"/></marker>
    <style>
      .title{font:700 36px Arial,sans-serif;fill:#eef4f2}.sub{font:16px Arial,sans-serif;fill:#91a5a6}.box{fill:#101b20;stroke:#2b3c42;stroke-width:2;rx:14;filter:url(#shadow)}.agent{stroke:#62dce0}.gate{stroke:#b7ef69}.danger{stroke:#f1b65d}.cloud{stroke:#6b8cff}.label{font:700 15px Arial,sans-serif;fill:#eaf0ef;text-anchor:middle}.small{font:12px Arial,sans-serif;fill:#8fa1a3;text-anchor:middle}.flow{fill:none;stroke:#5f7a80;stroke-width:2;marker-end:url(#arrow)}.pass{fill:#b7ef69;font:700 12px Arial,sans-serif}.fail{fill:#ff735d;font:700 12px Arial,sans-serif}
    </style>
  </defs>
  <rect width="1400" height="860" fill="url(#bg)"/>
  <text x="70" y="70" class="title">03:17 — Autonomous Maintenance Window</text>
  <text x="70" y="100" class="sub">Gemini reasons. Evidence Gates authorize. Every action is verified.</text>

  <rect class="box" x="70" y="160" width="230" height="90"/><text class="label" x="185" y="197">Web Dashboard</text><text class="small" x="185" y="222">topology · plan · evidence</text>
  <rect class="box cloud" x="380" y="160" width="230" height="90"/><text class="label" x="495" y="197">Cloud Run API</text><text class="small" x="495" y="222">approved request intake</text>
  <rect class="box cloud" x="690" y="160" width="230" height="90"/><text class="label" x="805" y="197">Pub/Sub</text><text class="small" x="805" y="222">maintenance.created</text>
  <rect class="box cloud" x="1000" y="160" width="230" height="90"/><text class="label" x="1115" y="197">Maintenance Worker</text><text class="small" x="1115" y="222">autonomous background run</text>
  <path class="flow" d="M300 205H375"/><path class="flow" d="M610 205H685"/><path class="flow" d="M920 205H995"/>

  <rect class="box agent" x="1000" y="330" width="230" height="100"/><text class="label" x="1115" y="370">Google ADK + Gemini</text><text class="small" x="1115" y="395">planner / replanner · Vertex AI</text>
  <rect class="box gate" x="690" y="330" width="230" height="100"/><text class="label" x="805" y="370">Plan Validator + Scheduler</text><text class="small" x="805" y="395">scope · dependencies · cycles</text>
  <rect class="box" x="380" y="330" width="230" height="100"/><text class="label" x="495" y="370">Evidence-Gated Tools</text><text class="small" x="495" y="395">authorized · idempotent · logged</text>
  <path class="flow" d="M1115 250V325"/><path class="flow" d="M1000 380H925"/><path class="flow" d="M690 380H615"/>
  <text x="942" y="363" class="small">plan delta</text><text x="628" y="363" class="pass">ELIGIBLE</text><text x="805" y="314" class="fail">REJECT → STRUCTURED REPLAN</text>

  <rect class="box" x="380" y="520" width="230" height="120"/><text class="label" x="495" y="558">Infrastructure Simulator</text><text class="small" x="495" y="583">LB · WEB01 · WEB02</text><text class="small" x="495" y="603">WORKER · DATABASE</text>
  <rect class="box danger" x="690" y="520" width="230" height="120"/><text class="label" x="805" y="558">Evidence Gates + Rollback</text><text class="small" x="805" y="583">health · availability · ownership</text><text class="small" x="805" y="603">authorize · restore · verify</text>
  <rect class="box cloud" x="1000" y="520" width="230" height="120"/><text class="label" x="1115" y="558">Firestore Audit</text><text class="small" x="1115" y="583">runs · events · actions</text><text class="small" x="1115" y="603">reports</text>
  <path class="flow" d="M495 430V515"/><path class="flow" d="M610 580H685"/><path class="flow" d="M920 580H995"/>
  <path class="flow" d="M1115 520V470H495V435"/>

  <rect x="70" y="720" width="1160" height="75" rx="12" fill="#0d1715" stroke="#2f4a3d"/>
  <text x="650" y="752" class="label">Golden outcome: WEB01 updated · WEB02 rolled back · Database deferred · Availability preserved</text>
  <text x="650" y="777" class="small">zero human intervention during the maintenance window</text>
</svg>
